
<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Sekolah Digital</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/nprogress@0.2.0/nprogress.js"></script>
    <link href="https://unpkg.com/nprogress@0.2.0/nprogress.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/id.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { 
                        bg: "#030712", 
                        surface: "#111827", 
                        primary: "#38bdf8", 
                        accent: "#8b5cf6",
                        glass: "rgba(30, 41, 59, 0.7)"
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* NProgress Bar Color */
        #nprogress .bar { background: linear-gradient(to right, #38bdf8, #8b5cf6) !important; height: 4px !important; }
        
        /* Glassmorphism Card */
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        /* Hover Effect */
        .hover-glow:hover {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateY(-4px);
        }
        
        /* Chat Bubble Style */
        .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; margin-bottom: 10px; position: relative; line-height: 1.4; }
        .chat-bubble.me { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .chat-bubble.other { background: #334155; color: #e2e8f0; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }

        /* Status Dot */
        .online-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-online { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .status-offline { background-color: #64748b; }

        /* Like Animation */
        .like-active { color: #ef4444; animation: heartbeat 0.4s ease-in-out; }
        @keyframes heartbeat { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
        
        /* Utilities */
        .clickable { cursor: pointer; user-select: none; }
        ::-webkit-scrollbar { width: 6px; } 
        ::-webkit-scrollbar-track { background: #030712; } 
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }
        
        select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
        
        #privacy-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999999; align-items: center; justify-content: center; flex-direction: column; color: white; font-weight: bold; text-align: center; }
    </style>
</head>
<body class="antialiased">

            <div class="hidden md:flex items-center gap-1 bg-white/5 p-1 rounded-full border border-white/5">
                <button onclick="window.navigateTo('home')" id="d-btn-home" class="px-5 py-1.5 rounded-full text-sm font-medium text-white bg-white/10 transition-all">Galeri</button>

        <div id="mobile-menu" class="hidden md:hidden max-w-5xl mx-auto mt-2 glass-card rounded-2xl p-2 space-y-1 transform transition-all origin-top z-50">
            <button onclick="window.navigateTo('home')" class="w-full text-left px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white transition flex items-center gap-3"><i class="fas fa-images w-5 text-center text-blue-400"></i> Galeri Utama</button>
            <button onclick="window.navigateTo('playlist')" class="w-full text-left px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white transition flex items-center gap-3"><i class="fas fa-music w-5 text-center text-purple-400"></i> Playlist</button>

            <button onclick="window.navigateTo('about')" class="w-full text-left px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white transition flex items-center gap-3"><i class="fas fa-info-circle w-5 text-center text-yellow-400"></i> Profil</button>

    <main class="relative z-10 pt-28 pb-20 px-4 container mx-auto max-w-6xl">
        
        <section id="view-home" class="view-section transition-all duration-500">

                <div class="grid md:grid-cols-2 gap-8">

                    <div class="grid grid-cols-2 gap-4"><div class="bg-white/5 p-4 rounded-xl text-center border border-white/5 hover:bg-white/10 transition"><div id="stat-1-val" class="text-3xl font-black text-white">-</div><div class="text-[10px] text-gray-500 uppercase font-bold">Siswa</div></div><div class="bg-white/5 p-4 rounded-xl text-center border border-white/5 hover:bg-white/10 transition"><div id="stat-2-val" class="text-3xl font-black text-white">-</div><div class="text-[10px] text-gray-500 uppercase font-bold">Prestasi</div></div></div>

    <div id="detail-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-2 md:p-4">

        <div class="glass-card w-full max-w-6xl h-[90vh] md:h-[85vh] rounded-2xl overflow-hidden flex flex-col lg:flex-row relative transform scale-95 opacity-0 transition-all duration-300 z-10 border border-white/10" id="modal-card">
            
            <button onclick="window.closeModal()" class="absolute top-3 right-3 z-50 bg-black/60 text-white w-9 h-9 rounded-full flex items-center justify-center hover:bg-red-500 transition clickable border border-white/20"><i class="fas fa-times"></i></button>

            <div class="lg:w-2/3 flex flex-col bg-black h-1/2 lg:h-full relative">
                <div class="flex-grow flex items-center justify-center bg-black relative overflow-hidden" id="modal-media-container"></div>

                            <span class="flex items-center gap-1"><i class="far fa-eye text-blue-400"></i> <span id="view-count">0</span></span>

                    <button onclick="window.handleReaction('like')" class="flex items-center gap-2 bg-white/5 hover:bg-white/10 px-4 py-2 rounded-full border border-white/5 transition clickable group">
                        <i class="far fa-heart group-hover:text-red-500 group-hover:scale-110 transition" id="btn-like-icon"></i>
                        <span id="like-count" class="font-bold text-sm text-white">0</span>
                    </button>
                </div>
            </div>

            <div class="lg:w-1/3 bg-[#0f172a] flex flex-col border-l border-white/10 h-1/2 lg:h-full">
                <div class="p-3 border-b border-white/10 bg-[#1e293b] flex justify-between items-center">
                    <h3 class="font-bold text-white text-sm flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Live Chat</h3>
                    <a id="m-full-link" href="#" target="_blank" class="text-[10px] font-bold bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded transition">FULL SCREEN</a>

                <div id="comments-list" class="flex-grow overflow-y-auto p-4 space-y-3 custom-scrollbar bg-[#0f172a] relative"></div>

                <div class="p-3 border-t border-white/10 bg-[#1e293b]">
                    <form id="comment-form" onsubmit="window.sendComment(event)" class="flex gap-2">
                        <input type="text" id="comment-input" class="flex-grow bg-black/30 text-white text-sm px-4 py-2.5 rounded-xl border border-white/10 focus:border-blue-500 focus:bg-white/5 outline-none transition" placeholder="Tulis komentar..." required autocomplete="off">
                        <button type="submit" class="w-10 h-10 rounded-xl bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center transition clickable shadow-lg shadow-blue-500/20"><i class="fas fa-paper-plane text-xs"></i></button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, runTransaction, onDisconnect, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // =====================================================
        // ⚠️ CONFIG FIREBASE SUDAH TERPASANG (US SERVER) ⚠️
        // =====================================================
        const firebaseConfig = {
          apiKey: "AIzaSyAYjnWMB23CQ2OnofJuoMBJyoxBahvPj9Q",
          authDomain: "sigitdb-eb445.firebaseapp.com",
          // URL Database US
          databaseURL: "https://sigitdb-eb445-default-rtdb.firebaseio.com/",
          projectId: "sigitdb-eb445",
          storageBucket: "sigitdb-eb445.firebasestorage.app",
          messagingSenderId: "939882511814",
          appId: "1:939882511814:web:797708c2440f35062646c7",
          measurementId: "G-JYV95GGYEG"
        };

        const app = initializeApp(firebaseConfig);
        const rtdb = getDatabase(app);

        let dbLocal = { gallery: [], teachers: [], playlist: [] };
        let itemMap = {};
        let currentItemId = null;
        let player = null;
        let userFingerprint = localStorage.getItem('user_fp') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('user_fp', userFingerprint);

        // PRESENCE SYSTEM
        const connectedRef = ref(rtdb, ".info/connected");
        const myStatusRef = ref(rtdb, "status/" + userFingerprint);
        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                set(myStatusRef, { state: 'online', last_changed: serverTimestamp() });
                onDisconnect(myStatusRef).remove();
                updateStatus(true);
            } else { updateStatus(false); }
        });
        function updateStatus(isOnline) {
            const dot = document.getElementById('global-status-dot');
            const text = document.getElementById('global-status-text');
            if(dot && text) {
                if(isOnline) { dot.className = "online-dot status-online"; text.innerText = "Online"; text.className = "text-green-400 text-[10px] font-bold"; }
                else { dot.className = "online-dot status-offline"; text.innerText = "Offline"; text.className = "text-gray-500 text-[10px]"; }
            }
        }

        // --- GLOBAL FUNCTIONS (FIX CLICK) ---
        window.navigateTo = (pageId) => {
            NProgress.start();
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + pageId).classList.remove('hidden');
            document.querySelectorAll('.nav-desk').forEach(btn => { btn.classList.remove('bg-white/10', 'text-white'); btn.classList.add('text-gray-400'); });
            const activeDesk = document.getElementById('d-btn-' + pageId);
            if(activeDesk) { activeDesk.classList.add('bg-white/10', 'text-white'); activeDesk.classList.remove('text-gray-400'); }
            window.scrollTo(0,0); document.getElementById('mobile-menu').classList.add('hidden');
            NProgress.done();
        };
        window.toggleMenu = () => document.getElementById('mobile-menu').classList.toggle('hidden');
        window.openModalById = openModalById;
        window.closeModal = closeModal;
        window.handleReaction = handleReaction;
        window.sendComment = sendComment;

        // LOAD DATA
        async function loadData() {
            NProgress.start();
            try {
                const res = await fetch('data.json?t=' + Date.now());
                const data = await res.json();
                dbLocal = data;
                itemMap = {};
                [...data.gallery, ...data.playlist].forEach(i => { if(i.id) itemMap[i.id] = i; });

                if(data.school_profile) {
                    document.getElementById('nav-school-name').innerText = data.school_profile.name;
                    document.getElementById('about-vision').innerText = data.school_profile.vision;
                    document.getElementById('about-mission').innerText = data.school_profile.mission;
                    document.getElementById('stat-1-val').innerText = data.school_profile.stats?.student || "-";
                    document.getElementById('stat-2-val').innerText = data.school_profile.stats?.award || "-";
                }
                
                if(data.settings?.anti_screenshot) {
                    document.addEventListener('contextmenu', e => e.preventDefault());
                    window.onblur = () => { document.getElementById('privacy-overlay').style.display = 'flex'; };
                    window.onfocus = () => { document.getElementById('privacy-overlay').style.display = 'none'; };
                }

                renderGallery(data.gallery || []);
                renderPlaylist(data.playlist || []);
                renderTeachers(data.teachers || []);
                const btnHome = document.getElementById('d-btn-home'); if(btnHome) btnHome.classList.add('bg-white/10', 'text-white');

            } catch (e) { console.log("Load error", e); }
            NProgress.done();
        }

        function renderGallery(items) {
            const grid = document.getElementById('gallery-grid'); grid.innerHTML = '';
            if(items.length === 0) { grid.innerHTML = '<div class="col-span-full text-center text-gray-600 py-20">Tidak ada konten.</div>'; return; }
            items.forEach(item => {
                const isVideo = item.type === 'video' || item.image.endsWith('.mp4');
                const media = isVideo ? `<div class="w-full h-56 bg-gray-900 flex items-center justify-center group-hover:scale-110 transition duration-700"><i class="fas fa-play text-4xl text-white/50 group-hover:text-white transition"></i></div>` : `<img src="${item.image}" loading="lazy" class="w-full h-56 object-cover transition duration-700 group-hover:scale-110">`;
                const div = document.createElement('div');
                div.className = 'glass-card rounded-2xl overflow-hidden group cursor-pointer hover-glow transition duration-300 clickable';
                div.onclick = () => openModalById(item.id);
                div.innerHTML = `<div class="relative overflow-hidden">${media}<div class="absolute top-3 left-3"><span class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-black/60 text-white backdrop-blur-md border border-white/10 uppercase">${item.category}</span></div></div><div class="p-5"><h3 class="text-white font-bold text-base line-clamp-1 mb-1 group-hover:text-blue-400 transition">${item.title}</h3><p class="text-gray-500 text-xs flex items-center gap-1"><i class="far fa-calendar"></i> ${item.date}</p></div>`;
                grid.appendChild(div);
            });
        }

        function renderPlaylist(items) {
            const container = document.getElementById('playlist-container'); container.innerHTML = '';
            items.forEach(item => {
                const isVideo = item.type === 'video';
                const div = document.createElement('div');
                div.className = 'glass-card p-3 rounded-xl flex items-center gap-4 hover:bg-white/5 transition cursor-pointer border border-white/5 clickable group';
                div.onclick = () => openModalById(item.id);
                div.innerHTML = `<div class="w-12 h-12 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white transition"><i class="fas ${isVideo?'fa-video':'fa-music'}"></i></div><div class="flex-grow"><h4 class="text-sm font-bold text-white line-clamp-1 group-hover:text-indigo-400 transition">${item.title}</h4><p class="text-xs text-gray-500">${item.artist||'Unknown'}</p></div><div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-gray-500 group-hover:text-white group-hover:bg-indigo-500 transition"><i class="fas fa-play text-xs"></i></div>`;
                container.appendChild(div);
            });
        }

        function renderTeachers(list) {
            const grid = document.getElementById('teacher-grid'); grid.innerHTML = '';
            list.forEach(t => {
                let socials = '';
                if(t.socials) { for(let k in t.socials) if(t.socials[k]) socials += `<a href="${t.socials[k]}" target="_blank" class="text-gray-500 hover:text-blue-400 transition"><i class="fab fa-${k=='wa'?'whatsapp':k=='ig'?'instagram':'link'} text-lg"></i></a>`; }
                const div = document.createElement('div');
                div.className = 'glass-card p-5 rounded-2xl flex flex-col items-center text-center hover-glow transition';
                div.innerHTML = `<div class="relative mb-4"><div class="w-20 h-20 rounded-full p-0.5 bg-gradient-to-br from-blue-500 to-purple-600"><img src="${t.image}" class="w-full h-full rounded-full object-cover bg-gray-900 border-2 border-[#0f172a]"></div><div class="absolute bottom-0 right-0 w-5 h-5 bg-[#0f172a] rounded-full flex items-center justify-center"><div class="w-2.5 h-2.5 bg-green-500 rounded-full"></div></div></div><h4 class="text-white font-bold text-sm mb-1">${t.name}</h4><p class="text-xs text-blue-400 font-medium mb-3 uppercase tracking-wide">${t.role}</p><div class="flex gap-3 mt-auto pt-3 border-t border-white/5 w-full justify-center">${socials}</div>`;
                grid.appendChild(div);
            });
        }

        function openModalById(id) {
            currentItemId = id;
            const item = itemMap[id]; if(!item) return;
            const safeId = id.replace(/[^a-zA-Z0-9]/g, '_');
            
            const modal = document.getElementById('detail-modal');
            const mediaBox = document.getElementById('modal-media-container');
            document.getElementById('comments-list').innerHTML = '<div class="text-center text-gray-600 text-xs mt-10"><i class="fas fa-circle-notch fa-spin text-blue-500"></i> Memuat...</div>';
            if(player) { player.destroy(); player = null; } mediaBox.innerHTML = '';

            const isVideo = item.type === 'video' || (item.image && item.image.endsWith('.mp4'));
            const src = item.src || item.image;

            if(isVideo) { mediaBox.innerHTML = `<video id="player" playsinline controls class="w-full h-full object-contain bg-black"><source src="${src}" type="video/mp4" /></video>`; player = new Plyr('#player', { autoplay: true }); }
            else if(item.type === 'audio') { mediaBox.innerHTML = `<div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-gray-900 to-black"><div class="w-32 h-32 rounded-full bg-white/5 flex items-center justify-center mb-6 animate-pulse-slow"><i class="fas fa-music text-5xl text-blue-500"></i></div><audio id="player" controls class="w-3/4"><source src="${src}" type="audio/mp3"></audio></div>`; player = new Plyr('#player', { autoplay: true }); }
            else { mediaBox.innerHTML = `<img src="${src}" class="w-full h-full object-contain">`; }

            document.getElementById('m-title').innerText = item.title;
            document.getElementById('m-date').innerText = item.date;
            document.getElementById('m-full-link').href = src;

            const viewRef = ref(rtdb, `posts/${safeId}/views`);
            runTransaction(viewRef, (v) => (v || 0) + 1);
            onValue(viewRef, (snap) => document.getElementById('view-count').innerText = snap.val() || 0);
            onValue(ref(rtdb, `posts/${safeId}/likes`), (snap) => document.getElementById('like-count').innerText = snap.val() || 0);
            
            const isLiked = localStorage.getItem(`liked_${safeId}`);
            document.getElementById('btn-like-icon').className = isLiked ? "fas fa-heart text-red-500" : "far fa-heart text-gray-400";

            onValue(ref(rtdb, `posts/${safeId}/comments`), (snapshot) => {
                const list = document.getElementById('comments-list'); list.innerHTML = '';
                const data = snapshot.val();
                if(!data) { list.innerHTML = '<div class="text-center text-gray-600 text-xs mt-10">Belum ada komentar.</div>'; }
                else {
                    Object.values(data).sort((a,b) => a.timestamp - b.timestamp).forEach(c => {
                        const isMe = c.userId === userFingerprint;
                        const div = document.createElement('div');
                        div.className = `chat-bubble ${isMe ? 'me' : 'other'}`;
                        div.innerHTML = `<div class="font-bold text-[10px] opacity-60 mb-1 flex justify-between"><span>${isMe ? 'Anda' : 'User'}</span><span>${moment(c.timestamp).fromNow()}</span></div><div class="break-words">${c.text}</div>`;
                        list.appendChild(div);
                    });
                    list.scrollTop = list.scrollHeight;
                }
            });

            modal.classList.remove('hidden');
            setTimeout(() => { document.getElementById('modal-backdrop').classList.remove('opacity-0'); document.getElementById('modal-card').classList.remove('opacity-0', 'scale-95'); document.getElementById('modal-card').classList.add('scale-100'); }, 10);
        }

        function closeModal() {
            if(player) player.stop();
            document.getElementById('modal-backdrop').classList.add('opacity-0'); document.getElementById('modal-card').classList.remove('scale-100'); document.getElementById('modal-card').classList.add('opacity-0', 'scale-95');
            setTimeout(() => document.getElementById('detail-modal').classList.add('hidden'), 300);
        }

        function handleReaction(type) {
            if(!currentItemId) return;
            const safeId = currentItemId.replace(/[^a-zA-Z0-9]/g, '_');
            if(type === 'like') {
                const key = `liked_${safeId}`;
                const isLiked = localStorage.getItem(key);
                const likeRef = ref(rtdb, `posts/${safeId}/likes`);
                if(isLiked) { runTransaction(likeRef, (v) => (v || 0) - 1); localStorage.removeItem(key); document.getElementById('btn-like-icon').className = "far fa-heart text-gray-400"; Toastify({text:"Batal Suka", duration:1500, style:{background:"#334155"}}).showToast(); }
                else { runTransaction(likeRef, (v) => (v || 0) + 1); localStorage.setItem(key, 'true'); document.getElementById('btn-like-icon').className = "fas fa-heart text-red-500 like-active"; setTimeout(()=>document.getElementById('btn-like-icon').classList.remove('like-active'), 500); Toastify({text:"Disukai ❤️", duration:1500, style:{background:"#ef4444"}}).showToast(); }
            }
        }

        function sendComment(e) {
            e.preventDefault();
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if(!text || !currentItemId) return;
            const safeId = currentItemId.replace(/[^a-zA-Z0-9]/g, '_');
            push(ref(rtdb, `posts/${safeId}/comments`), { text: text, userId: userFingerprint, timestamp: Date.now() })
            .then(() => { input.value = ''; Toastify({text:"Terkirim", duration:2000, style:{background:"#10b981"}}).showToast(); })
            .catch((err) => alert("Gagal: " + err));
        }

        document.getElementById('searchInput').addEventListener('input', handleFilter);
        document.getElementById('categoryFilter').addEventListener('change', handleFilter);
        function handleFilter() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            const filtered = dbLocal.gallery.filter(item => {
                const t = (item.title||"").toLowerCase().includes(term);
                const c = cat === 'all' || item.category === cat;
                if(cat === 'Video') return t && (item.type === 'video' || (item.image && item.image.endsWith('.mp4')));
                return t && c;
            });
            renderGallery(filtered);
        }

        try { AOS.init({ duration: 800, once: true }); } catch(e) {}
        moment.locale('id');
        loadData();
    </script>
</body>
</html>
