
<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Sekolah Digital</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/nprogress@0.2.0/nprogress.js"></script>
    <link href="https://unpkg.com/nprogress@0.2.0/nprogress.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }, colors: { dark: "#0f172a", primary: "#38bdf8", secondary: "#818cf8" } } } }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { background-color: #020617; color: #e2e8f0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        #nprogress .bar { background: #38bdf8 !important; height: 4px !important; }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        .clickable { cursor: pointer; position: relative; z-index: 10; }
        .nav-active { background: rgba(56, 189, 248, 0.2) !important; color: #38bdf8 !important; border-left: 3px solid #38bdf8; }
        .nav-desktop-active { background: #38bdf8 !important; color: white !important; box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        .card-hover { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(6, 182, 212, 0.15); border-color: rgba(56, 189, 248, 0.5); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
        #privacy-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 99999; align-items: center; justify-content: center; color: white; font-size: 1.5rem; font-weight: bold; text-align: center; }
    </style>
</head>
<body class="antialiased">

    <div id="privacy-overlay" class="hidden"><div><i class="fas fa-lock fa-3x mb-4 text-red-500"></i><br>Konten Dilindungi</div></div>
    <div class="fixed inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#020617] to-black"></div>
    <div class="fixed top-0 left-0 w-full h-full bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 pointer-events-none"></div>

    <nav class="fixed w-full z-50 glass-panel border-b border-white/5 top-0 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-3 cursor-pointer group" onclick="location.reload()">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-blue-600 flex items-center justify-center shadow-lg shadow-sky-500/20 group-hover:rotate-12 transition">
                        <i class="fas fa-graduation-cap text-white"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-lg text-white leading-none" id="nav-school-name">Sekolah</span>
                        <span class="text-[10px] text-sky-400 tracking-[0.3em] uppercase" id="nav-brand-color">Digital</span>
                    </div>
                </div>
                <div class="hidden md:flex items-center space-x-2 bg-white/5 p-1 rounded-full border border-white/10 backdrop-blur-md">
                    <button onclick="navigateTo('home')" id="d-btn-home" class="nav-desk px-5 py-2 rounded-full text-sm font-medium transition-all text-gray-400 hover:text-white">Galeri</button>
                    <button onclick="navigateTo('playlist')" id="d-btn-playlist" class="nav-desk px-5 py-2 rounded-full text-sm font-medium text-gray-400 hover:text-white transition-all">Playlist</button>
                    <button onclick="navigateTo('teachers')" id="d-btn-teachers" class="nav-desk px-5 py-2 rounded-full text-sm font-medium text-gray-400 hover:text-white transition-all">Guru</button>
                    <button onclick="navigateTo('about')" id="d-btn-about" class="nav-desk px-5 py-2 rounded-full text-sm font-medium text-gray-400 hover:text-white transition-all">Profil</button>
                </div>
                <button onclick="toggleMenu()" class="md:hidden w-10 h-10 flex items-center justify-center text-white bg-white/5 rounded-lg border border-white/10 active:scale-95 transition"><i class="fas fa-bars"></i></button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden glass-panel border-t border-white/5 absolute w-full left-0 transform transition-all duration-300 origin-top z-50">
            <div class="p-4 space-y-2">
                <button onclick="navigateTo('home')" id="m-btn-home" class="w-full text-left px-4 py-3 rounded-xl text-gray-300 font-medium hover:bg-white/5 transition flex items-center gap-3"><i class="fas fa-images w-6 text-center"></i> Galeri Utama</button>
                <button onclick="navigateTo('playlist')" id="m-btn-playlist" class="w-full text-left px-4 py-3 rounded-xl text-gray-300 font-medium hover:bg-white/5 transition flex items-center gap-3"><i class="fas fa-headphones-alt w-6 text-center"></i> Playlist</button>
                <button onclick="navigateTo('teachers')" id="m-btn-teachers" class="w-full text-left px-4 py-3 rounded-xl text-gray-300 font-medium hover:bg-white/5 transition flex items-center gap-3"><i class="fas fa-chalkboard-teacher w-6 text-center"></i> Guru</button>
                <button onclick="navigateTo('about')" id="m-btn-about" class="w-full text-left px-4 py-3 rounded-xl text-gray-300 font-medium hover:bg-white/5 transition flex items-center gap-3"><i class="fas fa-info-circle w-6 text-center"></i> Profil</button>
                <div class="border-t border-white/10 my-2"></div>
                <button onclick="navigateTo('settings')" id="m-btn-settings" class="w-full text-left px-4 py-3 rounded-xl text-gray-300 font-medium hover:bg-white/5 transition flex items-center gap-3"><i class="fas fa-cog w-6 text-center"></i> Pengaturan</button>
            </div>
        </div>
    </nav>

    <main class="relative z-10 pt-28 pb-20 min-h-screen container mx-auto px-4 sm:px-6">
        
        <section id="view-home" class="view-section transition-all duration-500">
            <div class="text-center max-w-3xl mx-auto mb-12" data-aos="fade-down">
                <h1 class="text-4xl md:text-6xl font-black text-white mb-6 leading-tight">Galeri <span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-purple-500">Aktivitas</span></h1>
                <div class="glass-panel p-2 rounded-2xl flex flex-col md:flex-row gap-3 shadow-2xl relative z-30">
                    <div class="relative flex-grow"><i class="fas fa-search absolute left-5 top-4 text-gray-500"></i><input type="text" id="searchInput" placeholder="Cari momen..." class="w-full bg-black/20 text-white pl-12 pr-4 py-3.5 rounded-xl border border-transparent focus:border-sky-500/50 focus:bg-black/40 focus:outline-none transition"></div>
                    <select id="categoryFilter" class="bg-black/20 text-gray-300 px-6 py-3.5 rounded-xl border border-transparent focus:border-sky-500/50 focus:bg-black/40 focus:outline-none cursor-pointer hover:bg-black/30 transition font-medium appearance-none pr-10">
                        <option value="all">Semua</option><option value="Prestasi">🏆 Prestasi</option><option value="Kegiatan">⛺ Kegiatan</option><option value="Organisasi">👔 Organisasi</option><option value="Video">🎬 Video</option><option value="Umum">📷 Umum</option>
                    </select>
                </div>
            </div>
            <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <section id="view-playlist" class="view-section hidden">
            <div class="text-center max-w-3xl mx-auto mb-12"><h1 class="text-4xl font-black text-white mb-6">Playlist <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">Multimedia</span></h1></div>
            <div id="playlist-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-4xl mx-auto"></div>
        </section>

        <section id="view-teachers" class="view-section hidden">
            <div class="text-center mb-16"><h2 class="text-4xl font-bold text-white mb-4">Dewan Guru & Staf</h2></div>
            <div id="teacher-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </section>

        <section id="view-settings" class="view-section hidden">
            <div class="max-w-2xl mx-auto glass-panel rounded-2xl p-8">
                <h2 class="text-2xl font-bold text-white mb-6 border-b border-white/10 pb-4">Pengaturan</h2>
                <div class="space-y-6">
                    <div class="flex justify-between items-center"><div><h3 class="text-white font-medium">Mode Gelap</h3><p class="text-xs text-gray-500">Permanen</p></div><div class="w-11 h-6 bg-blue-600 rounded-full relative"><div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full"></div></div></div>
                    <div class="flex justify-between items-center">
                        <div><h3 class="text-white font-medium">Animasi Latar</h3><p class="text-xs text-gray-500">Matikan jika lag</p></div>
                        <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="anim-toggle" class="sr-only peer" onchange="toggleAnim()"><div class="w-11 h-6 bg-gray-700 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all border-gray-600 peer-checked:bg-blue-600"></div></label>
                    </div>
                </div>
            </div>
        </section>

        <section id="view-about" class="view-section hidden">
            <div class="max-w-5xl mx-auto glass-panel rounded-3xl p-12 border border-white/10">
                <h2 class="text-4xl font-bold text-white mb-6">Visi & Misi</h2>
                <div class="space-y-6"><div class="bg-white/5 p-6 rounded-2xl border-l-4 border-sky-500"><p id="about-vision" class="text-gray-200 text-lg italic">Memuat...</p></div><div class="bg-white/5 p-6 rounded-2xl border-l-4 border-purple-500"><p id="about-mission" class="text-gray-400 whitespace-pre-line">Memuat...</p></div></div>
                <div class="mt-12"><h2 class="text-3xl font-bold text-white mb-4">Arsip</h2><div id="archive-list" class="relative border-l-2 border-white/10 ml-4 space-y-8 pb-12"></div></div>
            </div>
        </section>
    </main>

    <div id="detail-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/95 backdrop-blur-xl transition-opacity opacity-0" id="modal-backdrop" onclick="closeModal()"></div>
        <div class="bg-[#0f172a] w-full max-w-6xl max-h-[95vh] rounded-2xl overflow-hidden shadow-2xl border border-white/10 flex flex-col lg:flex-row relative transform scale-95 opacity-0 transition-all duration-300 z-10" id="modal-card">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-50 bg-black/50 hover:bg-red-500 text-white w-10 h-10 rounded-full flex items-center justify-center transition border border-white/20 clickable"><i class="fas fa-times"></i></button>
            <div class="lg:w-2/3 bg-black flex items-center justify-center relative overflow-hidden" id="modal-media-container"></div>
            <div class="lg:w-1/3 p-8 flex flex-col bg-[#1e293b] border-l border-white/5 overflow-y-auto custom-scrollbar">
                <div class="flex items-center gap-3 mb-6"><span id="m-cat" class="px-3 py-1 rounded-full text-xs font-bold bg-sky-500/20 text-sky-400 border border-sky-500/20 uppercase tracking-wider"></span><span id="m-date" class="text-xs text-gray-400 font-mono"></span></div>
                <h2 id="m-title" class="text-2xl font-bold text-white mb-4 leading-snug"></h2>
                <div class="prose prose-invert prose-sm max-w-none text-gray-300 mb-8 flex-grow"><p id="m-desc"></p></div>
                <div class="mt-auto pt-6 border-t border-white/10">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                        <div class="text-center md:text-left"><p class="text-xs text-gray-500 uppercase tracking-widest mb-2">Developer</p><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-white font-bold">D</div><div><h4 class="text-white text-sm font-bold">Garuda</h4></div></div></div>
                        <div class="flex gap-3" id="dev-socials"></div>
                    </div>
                </div>
                <div class="mt-4"><a id="m-full-link" href="#" target="_blank" class="w-full py-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-center transition flex items-center justify-center gap-2 shadow-lg shadow-sky-500/20 clickable"><i class="fas fa-external-link-alt"></i> Lihat Layar Penuh</a></div>
            </div>
        </div>
    </div>

    <script>
        // JS STABIL - MENGGUNAKAN ID MAP AGAR TIDAK ERROR KLIK
        try { AOS.init({ duration: 800, once: true }); } catch(e) {}
        let db = { gallery: [], teachers: [], playlist: [], profile: {}, settings: {}, developer: {} };
        let itemMap = {}; // Map ID ke Object
        let player = null;

        // DOM READY
        document.addEventListener('DOMContentLoaded', () => {
            const sInput = document.getElementById('searchInput');
            const catSelect = document.getElementById('categoryFilter');
            if(sInput) sInput.oninput = handleFilter;
            if(catSelect) catSelect.onchange = handleFilter;
            loadData();
        });

        function navigateTo(pageId) {
            NProgress.start();
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById('view-' + pageId);
            if(target) target.classList.remove('hidden');
            
            // Update Nav
            document.querySelectorAll('.nav-desk').forEach(el => el.classList.remove('nav-desktop-active', 'bg-sky-500', 'text-white'));
            const btn = document.getElementById('d-btn-' + pageId);
            if(btn) btn.classList.add('nav-desktop-active', 'bg-sky-500', 'text-white');
            
            document.querySelectorAll('#mobile-menu button').forEach(btn => { btn.classList.remove('nav-active', 'bg-white/5', 'text-sky-400'); btn.classList.add('text-gray-300'); });
            const mob = document.getElementById('m-btn-' + pageId);
            if(mob) { mob.classList.add('nav-active'); mob.classList.remove('text-gray-300'); }
            
            window.scrollTo(0, 0); document.getElementById('mobile-menu').classList.add('hidden');
            NProgress.done();
        }
        function toggleMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }
        function toggleAnim() { document.body.classList.toggle('no-anim'); }

        async function loadData() {
            NProgress.start();
            try {
                const res = await fetch('data.json?t=' + Date.now());
                if(!res.ok) throw new Error("Data missing");
                const data = await res.json();
                
                db.gallery = data.gallery || []; db.teachers = data.teachers || []; db.playlist = data.playlist || [];
                db.profile = data.school_profile || {}; db.settings = data.settings || {}; db.developer = data.developer || {};
                
                // Buat Map ID (PENTING!)
                itemMap = {};
                [...db.gallery, ...db.playlist].forEach(item => { if(item.id) itemMap[item.id] = item; });

                if(db.profile) {
                    if(document.getElementById('nav-school-name')) document.getElementById('nav-school-name').innerText = db.profile.name || "Sekolah";
                    if(document.getElementById('nav-brand-color')) document.getElementById('nav-brand-color').innerText = db.profile.brand_color || "Digital";
                    if(document.getElementById('about-vision')) document.getElementById('about-vision').innerText = db.profile.vision || "-";
                    if(document.getElementById('about-mission')) document.getElementById('about-mission').innerText = db.profile.mission || "-";
                }
                if(db.settings.anti_screenshot) {
                     document.addEventListener('contextmenu', e => e.preventDefault());
                     window.onblur = () => { document.body.style.filter = 'blur(20px)'; document.getElementById('privacy-overlay').style.display = 'flex'; };
                     window.onfocus = () => { document.body.style.filter = 'none'; document.getElementById('privacy-overlay').style.display = 'none'; };
                }

                renderGallery(db.gallery); renderPlaylist(db.playlist); renderTeachers(db.teachers); renderArchive(db.gallery);
                const activeDesk = document.getElementById('d-btn-home'); if(activeDesk) activeDesk.classList.add('nav-desktop-active');

            } catch (e) { console.error(e); }
            NProgress.done();
        }

        function renderGallery(items) {
            const grid = document.getElementById('gallery-grid'); if(!grid) return;
            grid.innerHTML = '';
            items.forEach(item => {
                const isVideo = item.type === 'video' || item.image.endsWith('.mp4');
                const media = isVideo ? `<div class="w-full h-full bg-gray-800 flex items-center justify-center"><i class="fas fa-play-circle text-5xl text-white/50"></i><video src="${item.image}#t=0.1" class="absolute inset-0 w-full h-full object-cover opacity-60 pointer-events-none"></video></div>` : `<img src="${item.image}" loading="lazy" class="w-full h-full object-cover transition duration-700 group-hover:scale-110 pointer-events-none">`;
                const div = document.createElement('div');
                div.className = 'glass-panel rounded-2xl overflow-hidden group cursor-pointer card-hover flex flex-col h-full clickable';
                // Fix Click Handler
                div.onclick = function() { openModalById(item.id); };
                div.innerHTML = `<div class="h-56 relative bg-black/50 pointer-events-none">${media}<div class="absolute top-3 left-3"><span class="px-3 py-1 rounded-lg text-[10px] font-bold bg-black/40 text-white border border-white/10 uppercase">${item.category}</span></div></div><div class="p-5 flex flex-col flex-grow pointer-events-none"><div class="flex items-center gap-2 text-xs text-gray-400 mb-2"><i class="far fa-calendar"></i> ${item.date}</div><h3 class="text-lg font-bold text-white mb-2 leading-snug line-clamp-2 group-hover:text-sky-400 transition">${item.title}</h3></div>`;
                grid.appendChild(div);
            });
        }

        function renderPlaylist(items) {
            const container = document.getElementById('playlist-container'); if(!container) return;
            container.innerHTML = '';
            if(items.length===0) container.innerHTML = '<div class="text-center text-gray-500 col-span-full">Playlist kosong.</div>';
            items.forEach(item => {
                const isVideo = item.type === 'video';
                const div = document.createElement('div');
                div.className = 'glass-panel p-4 rounded-xl flex items-center gap-4 hover:bg-white/5 transition cursor-pointer border border-white/5 clickable';
                div.onclick = function() { openModalById(item.id); };
                div.innerHTML = `<div class="w-12 h-12 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-white text-xl pointer-events-none"><i class="fas ${isVideo?'fa-video':'fa-music'}"></i></div><div class="pointer-events-none"><h4 class="font-bold text-white line-clamp-1">${item.title}</h4><p class="text-xs text-gray-400">${item.artist||'Unknown'}</p></div><div class="ml-auto pointer-events-none"><i class="fas fa-play text-sky-400"></i></div>`;
                container.appendChild(div);
            });
        }

        function renderTeachers(list) {
            const grid = document.getElementById('teacher-grid'); if(!grid) return;
            grid.innerHTML = '';
            list.forEach(t => {
                let socials = '';
                if(t.socials) { for (const [k, v] of Object.entries(t.socials)) { if(!v) continue; let icon = 'link'; if(k==='wa') icon='whatsapp'; else if(k==='ig') icon='instagram'; else if(k==='yt') icon='youtube'; else if(k==='tt') icon='tiktok'; socials += `<a href="${v}" target="_blank" class="text-gray-400 hover:text-white transition mx-1 clickable"><i class="fab fa-${icon}"></i></a>`; } }
                const div = document.createElement('div'); div.className = 'glass-panel p-6 rounded-2xl text-center border border-white/5 hover:-translate-y-2 transition duration-300';
                div.innerHTML = `<div class="w-24 h-24 mx-auto rounded-full p-1 bg-gradient-to-br from-gray-700 to-gray-800 mb-4"><img src="${t.image}" class="w-full h-full rounded-full object-cover border-2 border-sky-500/30"></div><h3 class="text-lg font-bold text-white mb-1">${t.name}</h3><p class="text-sm text-sky-400 mb-4">${t.role}</p><div class="flex justify-center gap-3 text-lg relative z-20">${socials}</div>`;
                grid.appendChild(div);
            });
        }
        
        function renderArchive(items) {
            const c = document.getElementById('archive-list'); if(!c) return; c.innerHTML = '';
            [...items].sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(item => {
                const el = document.createElement('div'); el.className = 'relative pl-8 group pb-8 border-l border-white/10 last:border-0';
                const title = document.createElement('h4'); title.className = 'text-lg font-bold text-white hover:text-sky-300 cursor-pointer transition clickable'; title.innerText = item.title;
                title.onclick = function() { openModalById(item.id); };
                el.innerHTML = `<div class="absolute -left-[5px] top-0 w-2.5 h-2.5 rounded-full bg-sky-500 shadow-[0_0_10px_#38bdf8]"></div><span class="text-xs text-sky-400 font-mono mb-1 block">${item.date}</span>`;
                el.appendChild(title); c.appendChild(el);
            });
        }

        function handleFilter() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            const filtered = db.gallery.filter(item => {
                const t = (item.title||"").toLowerCase().includes(term) || (item.description||"").toLowerCase().includes(term);
                const c = cat === 'all' || item.category === cat;
                if(cat === 'Video') return t && (item.type === 'video' || (item.image && item.image.endsWith('.mp4')));
                return t && c;
            });
            renderGallery(filtered);
        }

        function openModalById(id) {
            const item = itemMap[id]; if(!item) return;
            const mediaBox = document.getElementById('modal-media-container');
            if(player) { player.destroy(); player = null; }
            mediaBox.innerHTML = '';

            const isVideo = item.type === 'video' || (item.image && item.image.endsWith('.mp4')) || (item.src && item.src.endsWith('.mp4'));
            const src = item.src || item.image;

            if(isVideo) { mediaBox.innerHTML = `<video id="player" playsinline controls class="max-w-full max-h-[80vh] rounded-lg shadow-2xl"><source src="${src}" type="video/mp4" /></video>`; player = new Plyr('#player', { autoplay: true }); }
            else if(item.type === 'audio') { mediaBox.innerHTML = `<div class="w-full p-10 text-center"><i class="fas fa-music text-6xl text-sky-500 mb-4"></i><h3 class="text-white font-bold mb-4">${item.title}</h3><audio id="player" controls class="w-full"><source src="${src}" type="audio/mp3"></audio></div>`; player = new Plyr('#player', { autoplay: true }); }
            else { mediaBox.innerHTML = `<img src="${src}" class="max-w-full max-h-[70vh] object-contain rounded-lg shadow-2xl">`; }

            document.getElementById('m-title').innerText = item.title; document.getElementById('m-cat').innerText = item.category || 'Playlist'; document.getElementById('m-date').innerText = item.date || '-'; document.getElementById('m-desc').innerText = item.description || item.artist || ''; document.getElementById('m-full-link').href = src;

            const devBox = document.getElementById('dev-socials'); devBox.innerHTML = '';
            if(db.developer) {
                 if(db.developer.whatsapp) devBox.innerHTML += `<a href="${db.developer.whatsapp}" target="_blank" class="text-green-400 hover:text-green-300 text-xl transition clickable"><i class="fab fa-whatsapp"></i></a>`;
                 if(db.developer.tiktok) devBox.innerHTML += `<a href="${db.developer.tiktok}" target="_blank" class="text-pink-400 hover:text-pink-300 text-xl transition clickable"><i class="fab fa-tiktok"></i></a>`;
                 if(db.developer.youtube) devBox.innerHTML += `<a href="${db.developer.youtube}" target="_blank" class="text-red-400 hover:text-red-300 text-xl transition clickable"><i class="fab fa-youtube"></i></a>`;
                 if(db.developer.github) devBox.innerHTML += `<a href="${db.developer.github}" target="_blank" class="text-gray-400 hover:text-white text-xl transition clickable"><i class="fab fa-github"></i></a>`;
            }
            document.getElementById('detail-modal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('modal-backdrop').classList.remove('opacity-0'); document.getElementById('modal-card').classList.remove('opacity-0', 'scale-95'); document.getElementById('modal-card').classList.add('scale-100'); }, 10);
        }

        function closeModal() {
            if(player) player.stop();
            document.getElementById('modal-backdrop').classList.add('opacity-0'); document.getElementById('modal-card').classList.remove('scale-100'); document.getElementById('modal-card').classList.add('opacity-0', 'scale-95');
            setTimeout(() => { document.getElementById('detail-modal').classList.add('hidden'); document.getElementById('modal-media-container').innerHTML = ''; }, 300);
        }
    </script>
</body>
</html>
