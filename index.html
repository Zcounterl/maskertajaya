
<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Sekolah Digital</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/nprogress@0.2.0/nprogress.js"></script>
    <link href="https://unpkg.com/nprogress@0.2.0/nprogress.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }, colors: { dark: "#0f172a", primary: "#38bdf8", secondary: "#818cf8" } } } }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { background-color: #020617; color: #e2e8f0; overflow-x: hidden; }
        
        /* Loading Bar Custom */
        #nprogress .bar { background: #38bdf8 !important; height: 4px !important; }
        #nprogress .peg { box-shadow: 0 0 10px #38bdf8, 0 0 5px #38bdf8; }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        /* Animasi Hover Card */
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(6, 182, 212, 0.15); border-color: rgba(56, 189, 248, 0.5); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Video Aspect Ratio */
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-wrapper iframe, .video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Select Dropdown */
        select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200">

    <div class="fixed inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#020617] to-black"></div>
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl animate-pulse"></div>
    <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s"></div>

    <nav class="fixed w-full z-50 glass-panel border-b border-white/5 top-0">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-3 cursor-pointer group" onclick="location.reload()">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-blue-600 flex items-center justify-center shadow-lg shadow-sky-500/20 group-hover:scale-110 transition">
                        <i class="fas fa-graduation-cap text-white"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-lg text-white leading-none tracking-wide" id="nav-school-name">Sekolah</span>
                        <span class="text-[10px] text-sky-400 tracking-[0.3em] uppercase" id="nav-brand-color">Digital</span>
                    </div>
                </div>
                <div class="hidden md:flex items-center space-x-2 bg-white/5 p-1 rounded-full border border-white/10 backdrop-blur-md">
                    <button onclick="navigateTo('home')" id="btn-home" class="nav-item px-5 py-2 rounded-full text-sm font-medium transition-all bg-sky-500 text-white shadow-lg">Galeri</button>
                    <button onclick="navigateTo('teachers')" id="btn-teachers" class="nav-item px-5 py-2 rounded-full text-sm font-medium text-gray-400 hover:text-white transition-all">Guru</button>
                    <button onclick="navigateTo('about')" id="btn-about" class="nav-item px-5 py-2 rounded-full text-sm font-medium text-gray-400 hover:text-white transition-all">Profil</button>
                </div>
                <div class="md:hidden">
                    <button onclick="toggleMenu()" class="text-white text-2xl"><i class="fas fa-bars"></i></button>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden glass-panel border-t border-white/5 absolute w-full left-0 p-4 space-y-2">
            <button onclick="navigateTo('home')" class="block w-full text-left px-4 py-3 rounded-xl bg-white/5 text-sky-400">Galeri Utama</button>
            <button onclick="navigateTo('teachers')" class="block w-full text-left px-4 py-3 rounded-xl text-gray-300">Direktori Guru</button>
            <button onclick="navigateTo('about')" class="block w-full text-left px-4 py-3 rounded-xl text-gray-300">Profil Sekolah</button>
        </div>
    </nav>

    <main class="relative z-10 pt-28 pb-20 min-h-screen container mx-auto px-4 sm:px-6">
        
        <section id="view-home" class="view-section transition-all duration-500">
            <div class="text-center max-w-3xl mx-auto mb-12" data-aos="fade-down">
                <h1 class="text-4xl md:text-6xl font-black text-white mb-6 leading-tight">
                    Galeri <span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-purple-500">Aktivitas</span>
                </h1>
                
                <div class="glass-panel p-2 rounded-2xl flex flex-col md:flex-row gap-3 shadow-2xl">
                    <div class="relative flex-grow">
                        <i class="fas fa-search absolute left-5 top-4 text-gray-500"></i>
                        <input type="text" id="searchInput" placeholder="Cari momen..." class="w-full bg-black/20 text-white pl-12 pr-4 py-3.5 rounded-xl border border-transparent focus:border-sky-500/50 focus:bg-black/40 focus:outline-none transition placeholder-gray-600">
                    </div>
                    <select id="categoryFilter" class="bg-black/20 text-gray-300 px-6 py-3.5 rounded-xl border border-transparent focus:border-sky-500/50 focus:bg-black/40 focus:outline-none cursor-pointer hover:bg-black/30 transition font-medium appearance-none pr-10">
                        <option value="all">Semua</option>
                        <option value="Prestasi">🏆 Prestasi</option>
                        <option value="Kegiatan">⛺ Kegiatan</option>
                        <option value="Organisasi">👔 Organisasi</option>
                        <option value="Video">🎬 Video</option>
                        <option value="Umum">📷 Umum</option>
                    </select>
                </div>
            </div>

            <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-20">
                    <i class="fas fa-circle-notch fa-spin text-4xl text-sky-500"></i>
                    <p class="mt-4 text-gray-500 animate-pulse">Menghubungkan Database...</p>
                </div>
            </div>
        </section>

        <section id="view-teachers" class="view-section hidden">
            <div class="text-center mb-16" data-aos="fade-up">
                <h2 class="text-4xl font-bold text-white mb-4">Dewan Guru & Staf</h2>
                <p class="text-gray-400 max-w-2xl mx-auto">Pendidik profesional yang berdedikasi membimbing masa depan siswa.</p>
            </div>
            <div id="teacher-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </section>

        <section id="view-about" class="view-section hidden">
            <div class="max-w-5xl mx-auto" data-aos="zoom-in">
                <div class="glass-panel rounded-3xl p-8 md:p-12 border border-white/10 relative overflow-hidden">
                    <div class="flex flex-col md:flex-row gap-12 items-center relative z-10">
                        <div class="md:w-1/2">
                            <h2 class="text-4xl font-bold text-white mb-6">Visi & Misi</h2>
                            <div class="space-y-6">
                                <div class="bg-white/5 p-6 rounded-2xl border-l-4 border-sky-500">
                                    <h3 class="text-sky-400 font-bold mb-2 text-sm uppercase tracking-wider">Visi</h3>
                                    <p id="about-vision" class="text-gray-200 text-lg italic">Memuat...</p>
                                </div>
                                <div class="bg-white/5 p-6 rounded-2xl border-l-4 border-purple-500">
                                    <h3 class="text-purple-400 font-bold mb-2 text-sm uppercase tracking-wider">Misi</h3>
                                    <p id="about-mission" class="text-gray-400 whitespace-pre-line">Memuat...</p>
                                </div>
                            </div>
                        </div>
                        <div class="md:w-1/2 grid grid-cols-2 gap-4">
                            <div class="bg-black/30 p-6 rounded-2xl text-center border border-white/5">
                                <div id="stat-1-val" class="text-4xl font-black text-sky-400 mb-1">-</div>
                                <div class="text-xs text-gray-500 uppercase tracking-widest">Siswa</div>
                            </div>
                            <div class="bg-black/30 p-6 rounded-2xl text-center border border-white/5">
                                <div id="stat-2-val" class="text-4xl font-black text-purple-400 mb-1">-</div>
                                <div class="text-xs text-gray-500 uppercase tracking-widest">Prestasi</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="detail-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/95 backdrop-blur-xl transition-opacity opacity-0" id="modal-backdrop" onclick="closeModal()"></div>
        
        <div class="bg-[#0f172a] w-full max-w-6xl max-h-[95vh] rounded-2xl overflow-hidden shadow-2xl border border-white/10 flex flex-col lg:flex-row relative transform scale-95 opacity-0 transition-all duration-300 z-10" id="modal-card">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 z-50 bg-black/50 hover:bg-red-500 text-white w-10 h-10 rounded-full flex items-center justify-center transition border border-white/20"><i class="fas fa-times"></i></button>

            <div class="lg:w-2/3 bg-black flex items-center justify-center relative overflow-hidden" id="media-container">
                </div>

            <div class="lg:w-1/3 p-8 flex flex-col bg-[#1e293b] border-l border-white/5 overflow-y-auto custom-scrollbar">
                <div class="flex items-center gap-3 mb-6">
                    <span id="m-cat" class="px-3 py-1 rounded-full text-xs font-bold bg-sky-500/20 text-sky-400 border border-sky-500/20 uppercase tracking-wider"></span>
                    <span id="m-date" class="text-xs text-gray-400 font-mono"></span>
                </div>
                
                <h2 id="m-title" class="text-2xl font-bold text-white mb-4 leading-snug"></h2>
                <div class="prose prose-invert prose-sm max-w-none text-gray-300 mb-8 flex-grow">
                    <p id="m-desc"></p>
                </div>
                
                <div class="mt-auto pt-6 border-t border-white/10">
                    <a id="m-full-link" href="#" target="_blank" class="w-full py-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-center transition flex items-center justify-center gap-2 shadow-lg shadow-sky-500/20">
                        <i class="fas fa-external-link-alt"></i> Lihat Layar Penuh
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        AOS.init({ duration: 800, once: true });
        let db = { gallery: [], teachers: [], profile: {}, settings: {} };

        // Routing & UI
        function navigateTo(pageId) {
            NProgress.start();
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${pageId}`).classList.remove('hidden');
            
            // Update Buttons
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('bg-sky-500', 'text-white', 'shadow-lg');
                btn.classList.add('text-gray-400');
            });
            const activeBtn = document.getElementById(`btn-${pageId}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-gray-400');
                activeBtn.classList.add('bg-sky-500', 'text-white', 'shadow-lg');
            }
            
            window.scrollTo(0, 0);
            document.getElementById('mobile-menu').classList.add('hidden');
            NProgress.done();
        }
        function toggleMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }

        // Main Data Loader
        async function loadData() {
            NProgress.start();
            try {
                const res = await fetch('data.json?t=' + Date.now());
                if(!res.ok) throw new Error("Data missing");
                const data = await res.json();
                
                db.gallery = data.gallery || [];
                db.teachers = data.teachers || [];
                db.profile = data.school_profile || {};
                db.settings = data.settings || {};

                // Apply Settings
                applySecurity(db.settings);
                applyProfile(db.profile);
                
                renderGallery(db.gallery);
                renderTeachers(db.teachers);
            } catch (e) {
                console.error(e);
                document.getElementById('gallery-grid').innerHTML = `<div class="col-span-full text-center text-red-400 bg-red-500/10 p-4 rounded-xl">Gagal memuat data.json.</div>`;
            }
            NProgress.done();
        }

        function applySecurity(settings) {
            if(settings.anti_screenshot) {
                // Disable Right Click
                document.addEventListener('contextmenu', event => event.preventDefault());
                // Disable PrintScreen / Shortcuts
                document.addEventListener('keydown', function(e) {
                    if((e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u')) || e.key === 'PrintScreen') {
                        e.preventDefault();
                        alert('Fitur ini dilindungi oleh kebijakan privasi sekolah.');
                    }
                });
                // CSS Protection
                document.body.style.userSelect = 'none';
            }
        }

        function applyProfile(profile) {
            if(!profile) return;
            document.getElementById('nav-school-name').innerText = profile.name || "Sekolah";
            document.getElementById('nav-brand-color').innerText = profile.brand_color || "Digital";
            document.getElementById('about-vision').innerText = profile.vision || "-";
            document.getElementById('about-mission').innerText = profile.mission || "-";
            document.getElementById('stat-1-val').innerText = profile.stats?.student || "0";
            document.getElementById('stat-2-val').innerText = profile.stats?.award || "0";
        }

        // Render Gallery (Images & Videos)
        function renderGallery(items) {
            const grid = document.getElementById('gallery-grid'); grid.innerHTML = '';
            if(items.length === 0) { grid.innerHTML = `<div class="col-span-full text-center text-gray-500 py-20">Belum ada konten.</div>`; return; }
            
            items.forEach((item, i) => {
                const isVideo = item.type === 'video' || item.image.endsWith('.mp4');
                const typeBadge = isVideo ? '<span class="bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded mr-2"><i class="fas fa-play"></i> VIDEO</span>' : '';
                
                // Thumbnail logic: if video and no thumb provided, use generic video icon bg
                let mediaContent;
                if (isVideo) {
                    mediaContent = `
                        <div class="w-full h-full bg-gray-800 flex items-center justify-center relative group-hover:scale-110 transition duration-700">
                            <i class="fas fa-play-circle text-5xl text-white/50 group-hover:text-sky-400 transition"></i>
                             <video src="${item.image}#t=1.0" class="absolute inset-0 w-full h-full object-cover opacity-60" muted preload="metadata"></video>
                        </div>`;
                } else {
                    mediaContent = `<img src="${item.image}" loading="lazy" class="w-full h-full object-cover transition duration-700 group-hover:scale-110">`;
                }

                const div = document.createElement('div');
                div.className = 'glass-panel rounded-2xl overflow-hidden group cursor-pointer card-hover flex flex-col h-full';
                div.setAttribute('data-aos', 'fade-up'); 
                div.setAttribute('data-aos-delay', i * 50);
                div.onclick = () => openModal(item);
                
                div.innerHTML = `
                    <div class="h-56 overflow-hidden relative bg-black/50">
                        ${mediaContent}
                        <div class="absolute top-3 left-3 flex items-center">
                            ${typeBadge}
                            <span class="px-3 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider border backdrop-blur-md bg-black/40 text-white border-white/10">${item.category}</span>
                        </div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <div class="flex items-center gap-2 text-xs text-gray-400 mb-2"><i class="far fa-calendar"></i> ${item.date}</div>
                        <h3 class="text-lg font-bold text-white mb-2 leading-snug line-clamp-2 group-hover:text-sky-400 transition">${item.title}</h3>
                        <p class="text-sm text-gray-400 line-clamp-2 mb-4 flex-grow">${item.description}</p>
                        <div class="pt-4 border-t border-white/5 flex items-center text-xs font-medium text-sky-400">
                            Lihat Detail <i class="fas fa-arrow-right ml-2 transition-transform group-hover:translate-x-1"></i>
                        </div>
                    </div>`;
                grid.appendChild(div);
            });
        }

        // Render Teachers (Dynamic Socials)
        function renderTeachers(list) {
            const grid = document.getElementById('teacher-grid'); grid.innerHTML = '';
            if(!list || list.length === 0) { grid.innerHTML = `<div class="col-span-full text-center text-gray-500">Data guru belum diisi.</div>`; return; }
            
            list.forEach(t => {
                // Generate Social Icons Dynamically
                let socialHtml = '';
                if(t.socials) {
                    for (const [key, url] of Object.entries(t.socials)) {
                        if(!url) continue;
                        let icon = 'fa-link'; let color = 'hover:text-white';
                        if(key === 'wa') { icon = 'fa-whatsapp'; color = 'hover:text-green-400'; }
                        else if(key === 'ig') { icon = 'fa-instagram'; color = 'hover:text-pink-500'; }
                        else if(key === 'fb') { icon = 'fa-facebook'; color = 'hover:text-blue-500'; }
                        else if(key === 'yt') { icon = 'fa-youtube'; color = 'hover:text-red-500'; }
                        else if(key === 'tt') { icon = 'fa-tiktok'; color = 'hover:text-pink-400'; }
                        else if(key === 'email') { icon = 'fa-envelope'; color = 'hover:text-yellow-400'; }
                        
                        socialHtml += `<a href="${url}" target="_blank" class="text-gray-400 ${color} transition transform hover:scale-110"><i class="fab ${icon} text-xl"></i></a>`;
                    }
                }

                const div = document.createElement('div');
                div.className = 'glass-panel p-6 rounded-2xl text-center border border-white/5 hover:-translate-y-2 transition duration-300 group';
                div.innerHTML = `
                    <div class="w-28 h-28 mx-auto rounded-full p-1 bg-gradient-to-br from-gray-700 to-gray-800 group-hover:from-sky-500 group-hover:to-blue-600 transition mb-4 shadow-xl relative">
                        <img src="${t.image}" class="w-full h-full rounded-full object-cover border-4 border-[#1e293b]" onerror="this.src='https://ui-avatars.com/api/?name=${t.name}&background=random'">
                    </div>
                    <h3 class="text-xl font-bold text-white mb-1">${t.name}</h3>
                    <p class="text-sm text-sky-400 font-medium mb-4 uppercase tracking-wide">${t.role}</p>
                    <div class="flex justify-center gap-4 bg-black/20 py-3 rounded-xl">${socialHtml || '<span class="text-xs text-gray-600">No Socials</span>'}</div>
                `;
                grid.appendChild(div);
            });
        }

        // Filter Logic (Fixed)
        function handleFilter() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            
            const filtered = db.gallery.filter(item => {
                const matchText = item.title.toLowerCase().includes(term) || item.description.toLowerCase().includes(term);
                const matchCat = cat === 'all' || item.category === cat;
                // Special filter for video
                if(cat === 'Video') return matchText && (item.type === 'video' || item.image.endsWith('.mp4'));
                return matchText && matchCat;
            });
            renderGallery(filtered);
        }
        document.getElementById('searchInput').addEventListener('input', handleFilter);
        document.getElementById('categoryFilter').addEventListener('change', handleFilter);

        // Modal Logic (Video Support)
        const modal = document.getElementById('detail-modal');
        const backdrop = document.getElementById('modal-backdrop');
        const card = document.getElementById('modal-card');
        const mediaContainer = document.getElementById('media-container');

        function openModal(item) {
            const isVideo = item.type === 'video' || item.image.endsWith('.mp4');
            
            // Reset content
            mediaContainer.innerHTML = '';
            
            if(isVideo) {
                mediaContainer.innerHTML = `
                    <video id="player" playsinline controls class="max-w-full max-h-[80vh] shadow-2xl">
                        <source src="${item.image}" type="video/mp4" />
                    </video>`;
                new Plyr('#player', { autoplay: true });
            } else {
                mediaContainer.innerHTML = `<img src="${item.image}" class="max-w-full max-h-[85vh] object-contain shadow-2xl rounded-lg">`;
            }

            document.getElementById('m-title').innerText = item.title;
            document.getElementById('m-desc').innerText = item.description;
            document.getElementById('m-cat').innerText = item.category;
            document.getElementById('m-date').innerText = item.date;
            document.getElementById('m-full-link').href = item.image; // Tombol Full View

            modal.classList.remove('hidden');
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                card.classList.remove('opacity-0', 'scale-95');
                card.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            backdrop.classList.add('opacity-0');
            card.classList.remove('scale-100');
            card.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                mediaContainer.innerHTML = ''; // Stop video
            }, 300);
        }

        loadData();
    </script>
</body>
</html>
