
<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Sekolah Digital</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/nprogress@0.2.0/nprogress.js"></script>
    <link href="https://unpkg.com/nprogress@0.2.0/nprogress.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/id.js"></script>

    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }, 
                    colors: { dark: "#0f172a", primary: "#38bdf8", secondary: "#818cf8" },
                    animation: { 'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                } 
            } 
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { background-color: #020617; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        
        /* NProgress Color */
        #nprogress .bar { background: #38bdf8 !important; height: 3px !important; }
        
        /* Glassmorphism Style */
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        
        /* Chat Bubbles */
        .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; margin-bottom: 10px; position: relative; line-height: 1.4; }
        .chat-bubble.me { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .chat-bubble.other { background: #334155; color: #e2e8f0; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* Status Online Dot */
        .online-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-online { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-offline { background-color: #64748b; }
        
        /* Like Animation */
        .like-active { color: #ef4444; animation: heartbeat 0.4s ease-in-out; }
        @keyframes heartbeat { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
        
        /* Utility */
        .clickable { cursor: pointer; transition: transform 0.2s; }
        .clickable:active { transform: scale(0.95); }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #020617; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Anti Screenshot Overlay */
        #privacy-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 99999; align-items: center; justify-content: center; flex-direction: column; color: white; font-weight: bold; text-align: center; }
    </style>
</head>
<body class="antialiased">

    <div id="privacy-overlay" class="hidden">
        <i class="fas fa-shield-alt text-6xl mb-4 text-red-500 animate-pulse"></i>
        <h2 class="text-2xl">Konten Dilindungi</h2>
        <p class="text-sm text-gray-400 font-normal mt-2">Tangkapan layar tidak diizinkan.</p>
    </div>

    <div class="fixed inset-0 z-[-1] bg-[#020617]">
        <div class="absolute top-0 left-0 w-full h-full bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-10"></div>
        <div class="absolute top-[-10%] left-[-10%] w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[120px] animate-pulse-slow"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[120px] animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <nav class="fixed w-full z-50 glass-panel border-b border-white/5 top-0 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">

                </div>
                <div>
                    <span class="font-bold text-base text-white block leading-none" id="nav-school-name">Sekolah</span>

            </div>
            
            <div class="hidden md:flex items-center gap-1 bg-white/5 p-1 rounded-full border border-white/5">
                <button onclick="navigateTo('home')" id="d-btn-home" class="px-5 py-1.5 rounded-full text-sm font-medium text-white bg-white/10 transition-all">Galeri</button>
                <button onclick="navigateTo('playlist')" id="d-btn-playlist" class="px-5 py-1.5 rounded-full text-sm font-medium text-gray-400 hover:text-white transition-all">Playlist</button>
                <button onclick="navigateTo('teachers')" id="d-btn-teachers" class="px-5 py-1.5 rounded-full text-sm font-medium text-gray-400 hover:text-white transition-all">Guru</button>
                <button onclick="navigateTo('about')" id="d-btn-about" class="px-5 py-1.5 rounded-full text-sm font-medium text-gray-400 hover:text-white transition-all">Profil</button>
            </div>
            
            <button onclick="toggleMenu()" class="md:hidden w-9 h-9 flex items-center justify-center text-white bg-white/5 rounded-lg active:scale-95"><i class="fas fa-bars"></i></button>
        </div>
        
        <div id="mobile-menu" class="hidden md:hidden glass-panel border-t border-white/5 absolute w-full left-0">
            <div class="p-2 space-y-1">
                <button onclick="navigateTo('home')" class="w-full text-left px-4 py-3 rounded-xl bg-white/5 text-sky-400 font-medium"><i class="fas fa-images mr-3"></i> Galeri Utama</button>
                <button onclick="navigateTo('playlist')" class="w-full text-left px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 font-medium"><i class="fas fa-music mr-3"></i> Playlist</button>
                <button onclick="navigateTo('teachers')" class="w-full text-left px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 font-medium"><i class="fas fa-chalkboard-user mr-3"></i> Guru</button>
                <button onclick="navigateTo('about')" class="w-full text-left px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 font-medium"><i class="fas fa-info-circle mr-3"></i> Profil</button>
            </div>
        </div>
    </nav>

    <main class="relative z-10 pt-24 pb-20 min-h-screen container mx-auto px-4 sm:px-6">
        
        <section id="view-home" class="view-section transition-all duration-500">
            <div class="text-center mb-10">
                <h1 class="text-4xl font-bold text-white mb-4">Galeri & Komunitas</h1>
                <div class="glass-panel p-1.5 rounded-xl flex flex-col md:flex-row gap-2 max-w-2xl mx-auto border border-white/10">
                    <div class="relative flex-grow">
                        <i class="fas fa-search absolute left-4 top-3.5 text-gray-500"></i>

                    <select id="categoryFilter" class="bg-white/5 text-gray-300 px-4 py-2.5 rounded-lg outline-none border-none cursor-pointer hover:bg-white/10 transition">
                        <option value="all">Semua</option><option value="Prestasi">Prestasi</option><option value="Kegiatan">Kegiatan</option><option value="Organisasi">Organisasi</option><option value="Video">Video</option>

        <section id="view-playlist" class="view-section hidden">
            <div class="text-center mb-10"><h1 class="text-3xl font-bold text-white">Playlist <span class="text-purple-400">Multimedia</span></h1></div>

        <section id="view-about" class="view-section hidden">

                <div class="space-y-6">

                    <div class="pl-4 border-l-2 border-purple-500"><p class="text-purple-400 text-xs font-bold uppercase mb-1">Misi</p><p id="about-mission" class="text-gray-400 whitespace-pre-line">Loading...</p></div>

    <div id="detail-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-2 md:p-4">
        <div class="absolute inset-0 bg-black/95 backdrop-blur-sm transition-opacity opacity-0" id="modal-backdrop" onclick="closeModal()"></div>
        
        <div class="bg-[#0f172a] w-full max-w-6xl h-[90vh] md:h-[85vh] rounded-2xl overflow-hidden shadow-2xl border border-white/10 flex flex-col lg:flex-row relative transform scale-95 opacity-0 transition-all duration-300 z-10" id="modal-card">
            
            <button onclick="closeModal()" class="absolute top-3 right-3 z-50 bg-black/60 text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-red-500 transition clickable"><i class="fas fa-times"></i></button>

            <div class="lg:w-2/3 flex flex-col bg-black h-1/2 lg:h-full relative">
                <div class="flex-grow flex items-center justify-center bg-black relative overflow-hidden" id="modal-media-container"></div>
                
                <div class="p-4 bg-[#1e293b] border-t border-white/10 flex justify-between items-center">
                    <div>
                        <h2 id="m-title" class="text-lg font-bold text-white line-clamp-1">Judul</h2>
                        <div class="flex gap-4 text-xs text-gray-400 mt-1">
                            <span class="flex items-center gap-1"><i class="far fa-eye text-sky-400"></i> <span id="view-count">0</span></span>
                            <span class="flex items-center gap-1"><i class="far fa-clock text-purple-400"></i> <span id="m-date">Date</span></span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 bg-black/30 px-3 py-1.5 rounded-full border border-white/5">
                        <button onclick="handleReaction('like')" class="flex items-center gap-1.5 text-gray-400 hover:text-pink-500 transition group clickable">
                            <i class="far fa-heart group-hover:scale-110 transition" id="btn-like-icon"></i>
                            <span id="like-count" class="font-bold text-sm">0</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:w-1/3 bg-[#0f172a] flex flex-col border-l border-white/10 h-1/2 lg:h-full">
                <div class="p-3 border-b border-white/10 bg-[#1e293b] flex justify-between items-center">
                    <h3 class="font-bold text-white text-sm flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Live Chat
                    </h3>
                    <button onclick="openFullPage()" class="text-xs text-sky-400 hover:text-white transition">Full Page <i class="fas fa-external-link-alt ml-1"></i></button>
                </div>
                
                <div id="comments-list" class="flex-grow overflow-y-auto p-4 space-y-3 custom-scrollbar bg-[#0f172a] relative">
                    </div>

                <div class="p-3 border-t border-white/10 bg-[#1e293b]">
                    <form id="comment-form" onsubmit="sendComment(event)" class="flex gap-2">
                        <input type="text" id="comment-input" class="flex-grow bg-black/30 text-white text-sm px-4 py-2.5 rounded-full border border-white/10 focus:border-sky-500 focus:outline-none" placeholder="Tulis pesan..." required autocomplete="off">
                        <button type="submit" class="w-10 h-10 rounded-full bg-sky-600 hover:bg-sky-500 text-white flex items-center justify-center transition clickable shadow-lg"><i class="fas fa-paper-plane text-xs"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <section id="view-detail" class="view-section hidden pt-24 px-4 container mx-auto">
        <button onclick="navigateTo('home')" class="mb-4 flex items-center gap-2 text-sky-400 hover:text-white transition text-sm font-bold bg-white/5 px-3 py-1.5 rounded-lg w-fit hover:bg-white/10"><i class="fas fa-arrow-left"></i> Kembali</button>
        <div class="glass-panel rounded-2xl overflow-hidden border border-white/10">
            <div class="w-full bg-black flex items-center justify-center relative min-h-[300px] max-h-[700px]" id="detail-hero-container"></div>
            <div class="p-6 md:p-10">
                <div class="flex items-center gap-3 mb-4"><span id="detail-cat" class="px-3 py-1 rounded-md text-xs font-bold bg-sky-500/20 text-sky-400 border border-sky-500/20 uppercase">CAT</span><span id="detail-date" class="text-gray-400 text-xs font-mono">DATE</span></div>
                <h1 id="detail-title" class="text-3xl font-bold text-white mb-6">JUDUL</h1>
                <div class="prose prose-invert prose-sm max-w-none text-gray-300 rich-text pb-8 border-b border-white/10"><p id="detail-desc">DESC</p></div>
                <div class="mt-8 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <a id="download-btn" href="#" download class="w-full sm:w-auto px-6 py-3 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition clickable"><i class="fas fa-download"></i> <span id="download-text">Unduh</span></a>
                    <div class="flex gap-2"><span class="text-xs text-gray-500 self-center mr-2 uppercase tracking-wider">Developer:</span><div id="full-dev-socials" class="flex gap-2"></div></div>
                </div>
            </div>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, runTransaction, onDisconnect, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // --- CONFIG FIREBASE (DARI ANDA) ---
        const firebaseConfig = {
          apiKey: "AIzaSyAYjnWMB23CQ2OnofJuoMBJyoxBahvPj9Q",
          authDomain: "sigitdb-eb445.firebaseapp.com",
          projectId: "sigitdb-eb445",
          storageBucket: "sigitdb-eb445.firebasestorage.app",
          messagingSenderId: "939882511814",
          appId: "1:939882511814:web:797708c2440f35062646c7",
          measurementId: "G-JYV95GGYEG"
        };

        const app = initializeApp(firebaseConfig);
        const rtdb = getDatabase(app);

        // GLOBAL VARS
        let dbLocal = { gallery: [], teachers: [], playlist: [] };
        let itemMap = {};
        let currentItemId = null;
        let player = null;
        let userFingerprint = localStorage.getItem('user_fp') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('user_fp', userFingerprint);

        // PRESENCE SYSTEM
        const connectedRef = ref(rtdb, ".info/connected");
        const myStatusRef = ref(rtdb, "status/" + userFingerprint);
        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                set(myStatusRef, { state: 'online', last_changed: serverTimestamp() });
                onDisconnect(myStatusRef).remove();
                document.getElementById('global-status-dot').className = "online-dot status-online";
                document.getElementById('global-status-text').innerText = "Online";
            } else {
                document.getElementById('global-status-dot').className = "online-dot status-offline";
                document.getElementById('global-status-text').innerText = "Offline";
            }
        });

        // WINDOW FUNCTIONS
        window.navigateTo = (pageId) => {
            NProgress.start();
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + pageId).classList.remove('hidden');
            // Update Nav State
            document.querySelectorAll('.nav-desk').forEach(btn => { btn.classList.remove('bg-white/10', 'text-white'); btn.classList.add('text-gray-400'); });
            const activeDesk = document.getElementById('d-btn-' + pageId);
            if(activeDesk) { activeDesk.classList.add('bg-white/10', 'text-white'); activeDesk.classList.remove('text-gray-400'); }
            window.scrollTo(0,0); document.getElementById('mobile-menu').classList.add('hidden');
            NProgress.done();
        };
        window.toggleMenu = () => document.getElementById('mobile-menu').classList.toggle('hidden');
        window.openModalById = openModalById;
        window.closeModal = closeModal;
        window.handleReaction = handleReaction;
        window.sendComment = sendComment;
        window.openFullPage = openFullPage;

        // LOAD DATA
        async function loadStaticData() {
            try {
                const res = await fetch('data.json?t=' + Date.now());
                const data = await res.json();
                dbLocal = data;
                
                itemMap = {};
                [...data.gallery, ...data.playlist].forEach(i => { if(i.id) itemMap[i.id] = i; });
                
                if(data.school_profile) {
                    document.getElementById('nav-school-name').innerText = data.school_profile.name;
                    document.getElementById('about-vision').innerText = data.school_profile.vision;
                    document.getElementById('about-mission').innerText = data.school_profile.mission;
                }
                
                if(data.settings?.anti_screenshot) {
                     document.addEventListener('contextmenu', e => e.preventDefault());
                     window.onblur = () => { document.getElementById('privacy-overlay').style.display = 'flex'; };
                     window.onfocus = () => { document.getElementById('privacy-overlay').style.display = 'none'; };
                }

                renderGallery(data.gallery);
                renderTeachers(data.teachers);
                renderPlaylist(data.playlist);
                
                // Set Home Active
                const activeDesk = document.getElementById('d-btn-home');
                if(activeDesk) activeDesk.classList.add('bg-white/10', 'text-white');

            } catch (e) { console.log("Load error", e); }
        }

        function renderGallery(items) {
            const grid = document.getElementById('gallery-grid'); grid.innerHTML = '';
            items.forEach(item => {
                const isVideo = item.type === 'video' || item.image.endsWith('.mp4');
                const media = isVideo ? `<div class="w-full h-48 bg-gray-900 flex items-center justify-center"><i class="fas fa-play text-3xl text-white/50"></i></div>` : `<img src="${item.image}" loading="lazy" class="w-full h-48 object-cover transition duration-700 group-hover:scale-110">`;
                const div = document.createElement('div');
                div.className = 'glass-panel rounded-xl overflow-hidden group cursor-pointer hover:border-sky-500/50 transition duration-300 p-0 clickable';
                div.onclick = () => openModalById(item.id);
                div.innerHTML = `<div class="relative overflow-hidden">${media}<div class="absolute top-2 left-2 px-2 py-1 bg-black/60 text-white text-[10px] rounded uppercase font-bold backdrop-blur-sm border border-white/10">${item.category}</div></div><div class="p-4"><h3 class="text-white font-bold text-sm line-clamp-2 group-hover:text-sky-400 transition">${item.title}</h3><p class="text-gray-500 text-xs mt-2 flex items-center gap-1"><i class="far fa-calendar"></i> ${item.date}</p></div>`;
                grid.appendChild(div);
            });
        }

        function renderPlaylist(items) {
            const container = document.getElementById('playlist-container'); container.innerHTML = '';
            items.forEach(item => {
                const isVideo = item.type === 'video';
                const div = document.createElement('div');
                div.className = 'glass-panel p-3 rounded-xl flex items-center gap-3 hover:bg-white/5 transition cursor-pointer border border-white/5 clickable';
                div.onclick = () => openModalById(item.id);
                div.innerHTML = `<div class="w-10 h-10 rounded-lg bg-indigo-500/20 flex items-center justify-center text-indigo-400"><i class="fas ${isVideo?'fa-video':'fa-music'}"></i></div><div class="flex-grow"><h4 class="text-sm font-bold text-white line-clamp-1">${item.title}</h4><p class="text-xs text-gray-400">${item.artist||'Unknown'}</p></div><i class="fas fa-play text-sky-400 text-xs"></i>`;
                container.appendChild(div);
            });
        }

        function renderTeachers(list) {
            const grid = document.getElementById('teacher-grid'); grid.innerHTML = '';
            list.forEach(t => {
                let socials = '';
                if(t.socials) { for(let k in t.socials) if(t.socials[k]) socials += `<a href="${t.socials[k]}" target="_blank" class="text-gray-400 hover:text-sky-400 transition"><i class="fab fa-${k=='wa'?'whatsapp':k=='ig'?'instagram':'link'}"></i></a>`; }
                const div = document.createElement('div');
                div.className = 'glass-panel p-4 rounded-xl flex flex-col items-center text-center border border-white/5 hover:border-sky-500/30 transition';
                div.innerHTML = `<div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-br from-sky-500 to-blue-600 mb-3"><img src="${t.image}" class="w-full h-full rounded-full object-cover bg-gray-900"></div><h4 class="text-white font-bold text-sm line-clamp-1">${t.name}</h4><p class="text-xs text-sky-400 mb-2">${t.role}</p><div class="flex gap-3 text-sm mt-auto">${socials}</div>`;
                grid.appendChild(div);
            });
        }

        function openModalById(id) {
            currentItemId = id;
            const item = itemMap[id]; if(!item) return;
            const safeId = id.replace(/\./g, '_');
            
            const modal = document.getElementById('detail-modal');
            const mediaBox = document.getElementById('modal-media-container');
            document.getElementById('comments-list').innerHTML = '<div class="text-center text-gray-500 text-xs mt-10"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>';
            if(player) { player.destroy(); player = null; }
            mediaBox.innerHTML = '';

            const isVideo = item.type === 'video' || (item.image && item.image.endsWith('.mp4'));
            const src = item.src || item.image;

            if(isVideo) { mediaBox.innerHTML = `<video id="player" playsinline controls class="max-w-full max-h-full"><source src="${src}" type="video/mp4" /></video>`; player = new Plyr('#player', { autoplay: true }); }
            else if(item.type === 'audio') { mediaBox.innerHTML = `<div class="w-full p-10 text-center"><i class="fas fa-music text-6xl text-sky-500 mb-4 animate-pulse"></i><audio id="player" controls class="w-3/4"><source src="${src}" type="audio/mp3"></audio></div>`; player = new Plyr('#player', { autoplay: true }); }
            else { mediaBox.innerHTML = `<img src="${src}" class="max-w-full max-h-full object-contain">`; }

            document.getElementById('m-title').innerText = item.title;
            document.getElementById('m-date').innerText = item.date;
            document.getElementById('m-desc').innerText = item.description || item.artist || '-';

            // REALTIME STATS
            const viewRef = ref(dbRealtime, `posts/${safeId}/views`);
            runTransaction(viewRef, (v) => (v || 0) + 1);
            onValue(viewRef, (snap) => document.getElementById('view-count').innerText = snap.val() || 0);
            onValue(ref(dbRealtime, `posts/${safeId}/likes`), (snap) => document.getElementById('like-count').innerText = snap.val() || 0);
            
            const isLiked = localStorage.getItem(`liked_${safeId}`);
            const likeIcon = document.getElementById('btn-like-icon');
            likeIcon.className = isLiked ? "fas fa-heart text-pink-500" : "far fa-heart";

            // REALTIME COMMENTS
            onValue(ref(dbRealtime, `posts/${safeId}/comments`), (snapshot) => {
                const list = document.getElementById('comments-list'); list.innerHTML = '';
                const data = snapshot.val();
                if(!data) { list.innerHTML = '<div class="text-center text-gray-600 text-xs mt-10">Jadilah yang pertama berkomentar!</div>'; }
                else {
                    Object.values(data).sort((a,b) => a.timestamp - b.timestamp).forEach(c => {
                        const isMe = c.userId === userFingerprint;
                        const div = document.createElement('div');
                        div.className = `chat-bubble ${isMe ? 'me' : 'other'}`;
                        div.innerHTML = `<div class="font-bold text-[10px] opacity-70 mb-0.5 flex justify-between"><span>${isMe ? 'Anda' : 'Anonim'}</span><span>${moment(c.timestamp).fromNow()}</span></div><div>${c.text}</div>`;
                        list.appendChild(div);
                    });
                    list.scrollTop = list.scrollHeight;
                }
            });

            modal.classList.remove('hidden');
            setTimeout(() => { document.getElementById('modal-backdrop').classList.remove('opacity-0'); document.getElementById('modal-card').classList.remove('opacity-0', 'scale-95'); document.getElementById('modal-card').classList.add('scale-100'); }, 10);
        }

        function closeModal() {
            if(player) player.stop();
            document.getElementById('modal-backdrop').classList.add('opacity-0');
            document.getElementById('modal-card').classList.remove('scale-100');
            document.getElementById('modal-card').classList.add('opacity-0', 'scale-95');
            setTimeout(() => document.getElementById('detail-modal').classList.add('hidden'), 300);
        }

        function handleReaction(type) {
            if(!currentItemId) return;
            const safeId = currentItemId.replace(/\./g, '_');
            if(type === 'like') {
                const key = `liked_${safeId}`;
                const isLiked = localStorage.getItem(key);
                const likeRef = ref(dbRealtime, `posts/${safeId}/likes`);
                if(isLiked) { runTransaction(likeRef, (v) => (v || 0) - 1); localStorage.removeItem(key); document.getElementById('btn-like-icon').className = "far fa-heart"; }
                else { runTransaction(likeRef, (v) => (v || 0) + 1); localStorage.setItem(key, 'true'); document.getElementById('btn-like-icon').className = "fas fa-heart text-pink-500 like-active"; setTimeout(()=>document.getElementById('btn-like-icon').classList.remove('like-active'), 500); }
            } else { alert("Fitur Dislike dinonaktifkan."); }
        }

        function sendComment(e) {
            e.preventDefault();
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if(!text || !currentItemId) return;
            const safeId = currentItemId.replace(/\./g, '_');
            push(ref(dbRealtime, `posts/${safeId}/comments`), { text: text, userId: userFingerprint, timestamp: Date.now() }).then(() => { input.value = ''; });
        }

        function openFullPage() {
            closeModal();
            if(!currentItemId) return;
            navigateTo('detail');
            const item = itemMap[currentItemId];
            const isVideo = item.type === 'video' || (item.image && item.image.endsWith('.mp4'));
            const src = item.src || item.image;
            
            const hero = document.getElementById('detail-hero-container');
            if(player) { player.destroy(); player = null; }
            
            hero.innerHTML = isVideo ? `<video id="player-full" playsinline controls class="w-full h-full object-contain"><source src="${src}" type="video/mp4" /></video>` : `<img src="${src}" class="w-full h-full object-contain">`;
            if(isVideo) new Plyr('#player-full');

            document.getElementById('detail-title').innerText = item.title;
            document.getElementById('detail-desc').innerText = item.description || item.artist || '-';
            document.getElementById('detail-cat').innerText = item.category || 'Playlist';
            document.getElementById('detail-date').innerText = item.date;
            
            // DOWNLOAD BUTTON LOGIC
            const dlBtn = document.getElementById('download-btn');
            dlBtn.href = src;
            document.getElementById('download-text').innerText = isVideo ? "Unduh Video" : (item.type === 'audio' ? "Unduh Audio" : "Unduh Foto");

            // Dev Socials
            const devBox = document.getElementById('full-dev-socials'); devBox.innerHTML = '';
            if(dbLocal.developer) {
                const d = dbLocal.developer;
                if(d.whatsapp) devBox.innerHTML += `<a href="${d.whatsapp}" target="_blank" class="w-8 h-8 rounded bg-white/5 hover:bg-green-500 flex items-center justify-center text-gray-400 hover:text-white transition"><i class="fab fa-whatsapp"></i></a>`;
                if(d.tiktok) devBox.innerHTML += `<a href="${d.tiktok}" target="_blank" class="w-8 h-8 rounded bg-white/5 hover:bg-pink-500 flex items-center justify-center text-gray-400 hover:text-white transition"><i class="fab fa-tiktok"></i></a>`;
            }
        }

        moment.locale('id');
        loadStaticData();
    </script>
</body>
</html>
